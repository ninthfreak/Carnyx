<?xml version="1.0" encoding="UTF-8"?>
<!--
  Carnyx launcher icon — light-mode miniature of the radio face with the C·nyx
  monogram in the hero card.

  Canvas is 200×200 with a 40-unit corner radius. For an Android adaptive icon:
    • BACKGROUND layer = the single rect in <g id="background">, colour #E2E6EC.
    • FOREGROUND layer = everything in <g id="foreground">, scaled so that the
      200-unit canvas maps to the 108dp adaptive canvas, then the glyph reduced
      to ~85% about the centre so it sits inside the 66dp safe zone. The two
      corner marks (broadcast glyph, status bar) are the parts nearest a mask.
  No text, no <use>/<symbol>, no gradients — paths, groups, one clip-path only.
  Colours are the face's light-mode tokens: page #E2E6EC (darkened from
  #EEF1F5 for icon contrast), panel #FFFFFF, amber #C9760A, ink #1B222C.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Cuts the x's diagonals and the y's diagonal flat along the letters'
         top line (81.5) and baseline (106.5). Coordinates are in the same
         space as the letters group AFTER its translate(-3 0). -->
    <clipPath id="letterBand">
      <rect x="80" y="81.5" width="80" height="25"/>
    </clipPath>
  </defs>

  <g id="background">
    <rect width="200" height="200" rx="40" fill="#E2E6EC"/>
  </g>

  <g id="foreground">

    <!-- Status bar, left: the face's SignalWaves glyph (dot + paired arcs),
         at 75% and tucked into the corner. -->
    <g id="signal" transform="translate(28 28) scale(0.75)">
      <circle r="3.2" fill="#C9760A"/>
      <g fill="none" stroke="#C9760A" stroke-width="2.4" stroke-linecap="round">
        <path d="M-5.4 4.5 A7 7 0 0 1 -5.4 -4.5"/>
        <path d="M5.4 -4.5 A7 7 0 0 1 5.4 4.5"/>
        <path d="M-6.9 9.8 A12 12 0 0 1 -6.9 -9.8"/>
        <path d="M6.9 -9.8 A12 12 0 0 1 6.9 9.8"/>
        <path d="M-8.5 14.7 A17 17 0 0 1 -8.5 -14.7"/>
        <path d="M8.5 -14.7 A17 17 0 0 1 8.5 14.7"/>
      </g>
    </g>

    <!-- Status bar, right: abstracted tells/genre line. -->
    <rect id="statusBar" x="158" y="26" width="24" height="6" rx="3" fill="#B4BBC5"/>

    <!-- Hero band: two peek cards and the hero card. -->
    <g id="cards" fill="#FFFFFF" stroke="#5F6873" stroke-width="2">
      <rect id="peekLeft"  x="10"  y="59" width="50"  height="70" rx="10"/>
      <rect id="peekRight" x="140" y="59" width="50"  height="70" rx="10"/>
      <rect id="hero"      x="42"  y="48" width="116" height="92" rx="13"/>
      <!-- Preset row (inactive tiles). -->
      <rect x="17"  y="150" width="34" height="32" rx="7"/>
      <rect x="105" y="150" width="34" height="32" rx="7"/>
      <rect x="149" y="150" width="34" height="32" rx="7"/>
    </g>

    <!-- Active preset: larger, amber border. -->
    <rect id="presetActive" x="58" y="147" width="40" height="38" rx="8"
          fill="#FFFFFF" stroke="#C9760A" stroke-width="3"/>

    <!-- Monogram: amber C with an ink outline (ink stroke drawn under the
         amber one, 2 units wider each side). Centre (91,94), radius 30. -->
    <g id="monogramC" fill="none" stroke-linecap="round">
      <path d="M110.3 71 A30 30 0 1 0 110.3 117" stroke="#1B222C" stroke-width="14"/>
      <path d="M110.3 71 A30 30 0 1 0 110.3 117" stroke="#C9760A" stroke-width="10"/>
    </g>

    <!-- Monogram: "nyx" as monoline strokes. Top line 81.5, baseline 106.5,
         stroke 6.5, flat caps, mitred joins. -->
    <g id="monogramNyx" transform="translate(-3 0)"
       fill="none" stroke="#1B222C" stroke-width="6.5"
       stroke-linecap="butt" stroke-linejoin="miter">
      <!-- n: full-height left stem, short flat top, 45° shoulder down to a
           mid-height right stem. -->
      <path id="n" d="M104 106.5 V97 L91.75 84.75 H88 V106.5"/>
      <!-- y: diagonal from the top line down to the baseline, plus a vertical
           right stem that descends 10.8 below the baseline. -->
      <path id="yDiagonal" d="M103 79.5 L126 104.5" clip-path="url(#letterBand)"/>
      <path id="yStem"     d="M126 81.5 V115.3"/>
      <!-- x: two diagonals, overshot and clipped so the ends are horizontal. -->
      <path id="x" d="M132.2 78.5 L155.8 109.5 M155.8 78.5 L132.2 109.5"
            clip-path="url(#letterBand)"/>
    </g>

  </g>
</svg>
