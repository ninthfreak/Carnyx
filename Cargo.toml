# Carnyx — the Slint rebuild of the CarFM head-unit radio.
#
# One crate for now. The portable logic (RDS decoding, station identity, the
# signal-meter maths) comes across from the CarFM tree as it is needed, not
# ahead of it: a module ported without a caller is a second copy to maintain and
# proves nothing, which is the trap the first attempt fell into.
[package]
name = "carnyx"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Radio for a NOWADA Android head unit."

[lib]
# cdylib is what Android loads; rlib so the same code compiles for the host and
# `cargo build` / `cargo test` stay useful as a check. There is deliberately no
# desktop binary — this app targets the head unit.
crate-type = ["cdylib", "rlib"]

[dependencies]
slint = "1.17"

[build-dependencies]
slint-build = "1.17"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17", features = ["backend-android-activity-06"] }

# Screenshots. There is no desktop app, but the face still has to be LOOKED at
# without a car: `cargo run --example shot` renders every layout track headless
# and writes PNGs, which is what the design references get diffed against.
[dev-dependencies]
# The software renderer, driven directly — the testing backend's adapter has no
# take_snapshot, so the example builds its own minimal platform instead.
slint = { version = "1.17", features = ["renderer-software"] }
png = "0.18"

# Android packaging for cargo-apk.
#
# Every key below was checked against cargo-apk 0.10's own schema
# (ndk-build::manifest::{AndroidManifest, Sdk, Application, Activity}) and accepted
# by the tool. That check was worth doing: none of those structs use
# `deny_unknown_fields`, so a misspelled key is silently dropped rather than
# reported, and a build that "succeeds" can quietly ship the defaults.
#
# The APK itself has still never been built — this container has no SDK and no
# NDK, so the toolchain path beyond manifest parsing is untested.
[package.metadata.android]
package = "com.ninthfreak.carnyx"
# arm64 ONLY, deliberately. Slint's Android backend has a NON-OPTIONAL dependency
# on i-slint-renderer-skia (i-slint-backend-android-activity's Cargo.toml has no
# feature to turn it off), so every Android build drags in skia-bindings, which
# wants a prebuilt binary keyed by target triple. There is no armv7 prebuilt for
# skia-bindings 0.99 — the download 404s and it falls back to compiling Skia from
# source, which is a very long build for an ABI a modern head unit does not run.
# Check the unit with `adb shell getprop ro.product.cpu.abi`; if it really is
# armv7-only, add the triple back and budget for the source build.
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 34

[package.metadata.android.application]
label = "Carnyx"
# The face is the whole screen; the head unit has no use for a title bar.
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
# REQUIRED, and cargo-apk will not add it: Android 12 refuses to install a package
# whose targetSdk is 31+ if a component with an intent-filter does not declare
# android:exported. cargo-apk defaults Activity::exported to None and emits no
# attribute (ndk-build::manifest), while always serialising a MAIN/LAUNCHER
# filter — so the pair is a guaranteed INSTALL_PARSE_FAILED_MANIFEST_MALFORMED,
# which the on-device installer reports only as "App not installed".
exported = true
# DUDU OS resizes the app into vertical thirds, and the face reflows per surface
# rather than restarting — so it handles these itself.
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|density"
launch_mode = "singleTask"
