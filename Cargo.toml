# Carnyx — the Slint rebuild of the CarFM head-unit radio.
#
# One crate for now. The portable logic (RDS decoding, station identity, the
# signal-meter maths) comes across from the CarFM tree as it is needed, not
# ahead of it: a module ported without a caller is a second copy to maintain and
# proves nothing, which is the trap the first attempt fell into.
[package]
name = "carnyx"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Radio for a NOWADA Android head unit."

[lib]
# cdylib is what Android loads; rlib so the same code compiles for the host and
# `cargo build` / `cargo test` stay useful as a check. There is deliberately no
# desktop binary — this app targets the head unit.
crate-type = ["cdylib", "rlib"]

[dependencies]
slint = "1.17"
# The bundled FCC station table (`assets/db/stations.sqlite`, 20,733 rows) is a
# SQLite file, so something has to read SQLite.
#
# `bundled` compiles the amalgamation from source with `cc` rather than linking
# the platform's, and that is not a preference: Android's /system/lib/libsqlite.so
# is not an NDK public library and the linker namespace has rejected it since API
# 24, so on the head unit there is nothing to link against. Building it also pins
# the version, which is worth something for a file this app only ever reads.
#
# THE ARMV7 COMPILE OF THIS ONE C LIBRARY IS UNVERIFIED, because there is no NDK
# in the container it was written in and dl.google.com is refused by the proxy, so
# none could be fetched. What was actually established, rather than assumed:
#
#   * rusqlite 0.37 and libsqlite3-sys 0.35 — the Rust half — `cargo check` clean
#     for armv7-linux-androideabi with the C build satisfied out of band.
#   * the amalgamation compiles for the host, and all 38 tests in src/stations.rs
#     run against the real 20,733-row file through it.
#   * with CC set, the build gets as far as compiling sqlite3.c for
#     armv7a-linux-androideabi26 and stops only on the sysroot, which is the one
#     thing an NDK supplies. That is the whole of what is left unknown.
#
# BARE `cargo check --target armv7-linux-androideabi` WILL FAIL EVEN WITH AN NDK
# INSTALLED, and the README recommends that command, so: cc-rs falls back to a
# tool named `arm-linux-androideabi-clang`, which NDK r23 removed. `cargo apk`
# does not hit this — it exports CC_/CFLAGS_ for the triple itself
# (ndk-build-0.10.0 src/cargo.rs:58-59) — but a plain cargo invocation needs them:
#
#   export CC_armv7_linux_androideabi="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
#   export CFLAGS_armv7_linux_androideabi="--target=armv7a-linux-androideabi26"
#
# If it still fails there, the fallback is baking the table into a flat array in
# `build.rs` (~780 KB, no C anywhere) — a design change, to be taken as one rather
# than worked around.
rusqlite = { version = "0.37", features = ["bundled"] }

[build-dependencies]
slint-build = "1.17"
# javac and d8, for the Java half of the NWD tuner. `build.rs` imports it at the
# top rather than behind a cfg — the Android-only work is gated inside `main` —
# so it is a build dependency of every target, the host included. It costs
# nothing there: the two types are only constructed on the Android branch.
#
# This is the crate Slint's own Android backend dexes with; see build.rs's header
# for why a build script compiles Java at all.
android-build = "0.1.4"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17", features = ["backend-android-activity-06"] }
# The binder edge. 0.22 is not a free choice: Slint's Android backend already
# depends on it, so any other major would put a SECOND jni crate in the tree and
# its `Env` would not be the same type as the one Slint hands out.
jni = "0.22"
# The Activity lifecycle, for `MainEvent::{Pause, Stop, Destroy, LowMemory}`.
#
# Same rule as `jni` above and for the same reason: Slint's Android backend
# depends on android-activity 0.6 and hands us a `&PollEvent` through
# `init_with_event_listener`, so 0.6 HERE is what makes that reference a type
# this crate can match on. A different major would compile and then match
# nothing, because the two `PollEvent`s would not be the same type.
#
# It has to be a dependency at all because `slint::android` re-exports
# `AndroidApp` and nothing else — there is no path to `MainEvent` through slint.
android-activity = "0.6"

# Screenshots. There is no desktop app, but the face still has to be LOOKED at
# without a car: `cargo run --example shot` renders every layout track headless
# and writes PNGs, which is what the design references get diffed against.
[dev-dependencies]
# The software renderer, driven directly — the testing backend's adapter has no
# take_snapshot, so the example builds its own minimal platform instead.
slint = { version = "1.17", features = ["renderer-software"] }
png = "0.18"

# Android packaging for cargo-apk.
#
# Every key below was checked against cargo-apk 0.10's own schema
# (ndk-build::manifest::{AndroidManifest, Sdk, Application, Activity}) and accepted
# by the tool. That check was worth doing: none of those structs use
# `deny_unknown_fields`, so a misspelled key is silently dropped rather than
# reported, and a build that "succeeds" can quietly ship the defaults.
#
# This table is still the DEFAULT build and is not going anywhere yet. `android/`
# holds a Gradle build of the same APK, which exists because cargo-apk cannot
# declare the foreground service (see the long note further down); until that
# spike is confirmed on the unit, these two are kept in parity by hand and
# `android/app/src/main/AndroidManifest.xml` cites this file where they overlap.
[package.metadata.android]
package = "com.ninthfreak.carnyx"
# THE HEAD UNIT IS 32-BIT ARM. armeabi-v7a is not optional and not a nice-to-have
# — drop it and the APK will not install at all (INSTALL_FAILED_NO_MATCHING_ABIS).
# It was dropped once, to dodge a Skia build, and cost a failed sideload.
#
# The cost is real and belongs here rather than in a commit message: Slint's
# Android backend depends on i-slint-renderer-skia non-optionally, and
# skia-bindings has no prebuilt binary for armv7-linux-androideabi at 0.99 — the
# download 404s and Skia is compiled from source. See the README.
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]
# cargo-apk's default is StripConfig::Default, which copies the .so into the APK
# verbatim — debug symbols and all. Skia is compiled with `-g -gdwarf-2` and
# statically linked into our single library, so "and all" means the DWARF for
# 1158 Skia translation units. That is most of the 225 MB a debug APK weighs.
#
# `split` rather than `strip`: same APK, but objcopy also writes the symbols
# beside it as a .dwarf, so a native crash can still be symbolicated later.
strip = "split"
# Ships `assets/` into the APK. cargo-apk resolves this against the crate
# directory and hands it to `aapt package -A <dir>` (cargo-apk-0.10.0
# src/apk.rs:186-190, ndk-build-0.10.0 src/apk.rs:95-96), so
# `assets/db/stations.sqlite` arrives at the APK path `db/stations.sqlite`.
#
# MUST STAY ABOVE the `[package.metadata.android.*]` sub-tables below: in TOML a
# bare key after a table header belongs to that table, and cargo-apk's metadata
# struct does not reject unknown keys, so misplacing it would silently ship an
# APK with no database in it.
#
# The extraction on the other end is `stations::install`, and it exists because
# cargo-apk ties `disable_aapt_compression` to the build profile (src/apk.rs:214):
# a debug APK stores this file, a release APK DEFLATES it, and a deflated asset
# has no file descriptor to hand SQLite. Copying it out once sidesteps a bug that
# would otherwise appear only in release.
assets = "assets"

[package.metadata.android.sdk]
# 26 is NOT a preference, it is skia-bindings' floor. That crate hardcodes API
# level 26 in three places (build_support/platform/android.rs:10) — `ndk_api=26`
# for the GN build, and `-D__ANDROID_API__=26` for the four binding .cpp files
# it compiles itself.
#
# cargo-apk turns THIS number into `CXXFLAGS=--target=armv7a-linux-androideabi<n>`,
# which lands LAST on the compiler line and therefore wins. At 23 the two halves
# disagreed: Skia's own 1156 targets built at 26, then the bindings compiled at
# 23 and libc++'s <locale> failed on strtof_l/strtod_l, which bionic marks
# __INTRODUCED_IN(26). Raising it here is what makes them agree.
#
# The cost is a real install floor: Android 8.0. If the head unit is older than
# that, skia-bindings 0.99 cannot be built for it at all and the way forward is
# FemtoVG, which carries no such floor — see the README.
min_sdk_version = 26
target_sdk_version = 34

# PACKAGE VISIBILITY, and it is load-bearing rather than defensive. From
# targetSdk 30 onwards a package cannot see another package it has not declared,
# and the filtering is SILENT: `resolveService` returns null and `bindService`
# returns false on a unit that plainly has the vendor radio installed, so the
# tuner would report itself absent on the one device this app is for.
#
# Verified rather than assumed, because `ndk_build::manifest::AndroidManifest`
# has no `deny_unknown_fields` and would drop a wrong key without a word: this
# stanza was deserialized through that struct and serialized back out, and it
# emits `<queries><package android:name="com.nwd.radio.service"/></queries>`.
[[package.metadata.android.queries.package]]
name = "com.nwd.radio.service"

# THE STOCK RADIO APP, declared for the probe rather than for the tuner. Nothing
# in Carnyx talks to it — it is the app that launches itself on ACC-on and the
# subject of the "Where the stock radio app can be intercepted" row (#96). That
# probe reads its install shape, its components and its task affinities, and on
# targetSdk 30+ every one of those calls would come back empty WITHOUT SAYING
# WHY, which is precisely the shape of finding the probe exists to avoid.
#
# It costs nothing on this unit, which is Android 10 and filters nothing. It is
# here so the probe still answers on a ROM that is not.
[[package.metadata.android.queries.package]]
name = "com.nwd.radio"

# LOCATION. The nearby-station picker sorts by distance and the face carries a
# satellite glyph, and neither can be honest without a fix — today both run on
# `fake::FakeLocation`, which is pinned to Madison.
#
# Both permissions, matching CarFM (android/app/src/main/AndroidManifest.xml:2-3).
# COARSE alone would do for a picker sorted in kilometres, but FINE is what makes
# the in-motion glyph meaningful, and a head unit that has a GPS antenna at all
# will grant it.
#
# Checked the same way the `queries` stanza was, because the same silence
# applies: `ndk_build::manifest::AndroidManifest` declares
# `uses_permission: Vec<Permission>` with a `name` field renamed to
# `android:name` on serialize, and the struct is `#[serde(flatten)]`-ed into
# cargo-apk's metadata, so these reach the generated manifest.
#
# DECLARING IS NOT GRANTING. From API 23 these are runtime permissions, and a
# request needs an Activity and someone to tap Allow — which on a dashboard, at
# night, in a car, is nobody. The location code must therefore treat "denied"
# and "never answered" as ordinary states that leave the fake in place, not as
# errors.
# INTERNET, for the logo search. Every request fails without it, and the failure
# is a SecurityException rather than a timeout, so it would look like a bug in
# the transport rather than a missing line here.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_COARSE_LOCATION"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_FINE_LOCATION"

# WHAT CANNOT BE DECLARED HERE, AND WHAT IT COSTS.
#
# CarFM survives being switched away from. Carnyx does not — come back and the
# face is redrawing and the RadioText is being decoded again — and the difference
# is one component: CarFM runs `VibeStreamService` in the FOREGROUND even when
# the built-in NWD tuner is the source and the service carries no audio at all
# (`startNwdControlSession` → `startForegroundMedia` → `startForeground`,
# VibeStreamService.kt:726-739). A process with a foreground service is not a
# candidate for the launcher's cleaner or the low-memory killer, so its state is
# still in RAM when the driver comes back.
#
# CARGO-APK CANNOT DECLARE A SERVICE. This was checked rather than assumed, in
# the source: `ndk_build::manifest::Application` (ndk-build-0.10.0
# src/manifest.rs) has exactly `debuggable, theme, has_code, icon, label,
# extract_native_libs, uses_cleartext_traffic, meta_data, activity` — ONE
# activity, and no `service`, `receiver` or `provider` field to put anything
# else in. There is no custom-manifest escape hatch either: cargo-apk builds the
# manifest from this table alone (cargo-apk-0.10.0 src/apk.rs:33, 161-213) and
# quick-xml escapes every string it serialises, so it cannot be smuggled through
# an attribute. The same absence rules out CarFM's `BootReceiver`, which is what
# brings the app back after the unit wakes on ACC.
#
# So the foreground service is not a to-do that fits in this file. It needs the
# APK to be built by something that can write its own manifest — Gradle, or a
# forked cargo-apk — and until that happens the restart is a fact to survive
# rather than a bug to fix. `src/session.rs` is what survives it, and the
# `session:` line at the top of the diagnostics log is what says which of the two
# restarts actually happened on this unit.
#
# The permissions that go with a foreground service — FOREGROUND_SERVICE,
# FOREGROUND_SERVICE_MEDIA_PLAYBACK, POST_NOTIFICATIONS, WAKE_LOCK — are
# deliberately NOT declared below. A permission with nothing to use it is a
# prompt the driver answers for no reason and a line in the store listing that
# describes an app this is not.
[package.metadata.android.application]
label = "Carnyx"
# The face is the whole screen; the head unit has no use for a title bar.
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
# REQUIRED, and cargo-apk will not add it: Android 12 refuses to install a package
# whose targetSdk is 31+ if a component with an intent-filter does not declare
# android:exported. cargo-apk defaults Activity::exported to None and emits no
# attribute (ndk-build::manifest), while always serialising a MAIN/LAUNCHER
# filter — so the pair is a guaranteed INSTALL_PARSE_FAILED_MANIFEST_MALFORMED,
# which the on-device installer reports only as "App not installed".
exported = true
# EVERY CONFIGURATION CHANGE THIS APP CAN OUTLIVE, CLAIMED.
#
# A change not named here destroys the Activity and creates a new one, and on
# android-activity that means `android_main` RETURNS and is called again
# (android-activity-0.6.1 src/lib.rs:68-76) — a whole new App, a blank decoder,
# an empty log. Nothing on the face survives it. The list used to be six flags
# and was written for DUDU OS resizing the app into vertical thirds; it left out
# `uiMode`, which is the one a car actually produces, because a head unit flips
# day/night with the headlights and the OS shell changes it coming forward.
# CarFM claims `uiMode`; Carnyx did not, and was restarted by it.
#
# Claiming a change means handling it, and every one of these IS handled — by
# doing nothing, correctly:
#
#   * `density`, `screenSize`, `smallestScreenSize`, `screenLayout`,
#     `orientation` — Slint re-reads the window and the scale factor and the face
#     reflows from `Metrics` (i-slint-backend-android-activity, ConfigChanged).
#   * `uiMode` — day and night come from the VEHICLE, over the vendor's
#     illumination broadcast, not from Android's night mode. There is genuinely
#     nothing to do, which is exactly why being restarted for it was pure loss.
#   * `locale`, `layoutDirection`, `fontScale` — the face has one language and
#     its own type ramp, so none of the three changes a pixel.
#   * `keyboard`, `keyboardHidden`, `navigation`, `touchscreen`, `mcc`, `mnc` —
#     a dashboard has none of these and never will.
config_changes = "mcc|mnc|locale|touchscreen|keyboard|keyboardHidden|navigation|screenLayout|fontScale|uiMode|orientation|density|screenSize|smallestScreenSize|layoutDirection"
launch_mode = "singleTask"
