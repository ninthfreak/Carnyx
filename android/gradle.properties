android.useAndroidX=true
# Nothing in this project is a Kotlin module, and no AndroidX artifact is pulled
# in yet — the flag is here because AGP warns without it the moment the first
# androidx dependency arrives, which the foreground service's
# `ServiceCompat.startForeground` will need.

org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true

# NO NON-TRANSITIVE R CLASS SETTING AND NO RESOURCE SHRINKING, for one layout.
#
# This paragraph used to say the app had no resources at all, and that stopped
# being true with #88: `src/main/res/layout/station_popup.xml` is the station
# pop-up's banner, and it is the only one. The theme is still a framework theme
# (@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen) and no icon is
# declared, so the tree is one file deep and there is nothing for either setting
# to earn.
#
# THE cargo-apk BUILD STILL HAS NONE, which is the parity that matters: that
# packager ships no resources, so the layout is genuinely absent there and
# `CarnyxAlert` looks it up by name at run time rather than through `R`. An
# absent layout is a supported state, not a broken build.
