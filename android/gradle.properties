android.useAndroidX=true
# Nothing in this project is a Kotlin module, and no AndroidX artifact is pulled
# in yet — the flag is here because AGP warns without it the moment the first
# androidx dependency arrives, which the foreground service's
# `ServiceCompat.startForeground` will need.

org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true

# NO NON-TRANSITIVE R CLASS SETTING AND NO RESOURCE SHRINKING, for one layout
# and one icon.
#
# This paragraph used to say the app had no resources at all, and that stopped
# being true with #88: `src/main/res/layout/station_popup.xml` is the station
# pop-up's banner. It then said the layout was the ONLY one and that no icon was
# declared, and that stopped being true too — `mipmap-*/ic_launcher.png` is five
# more files, generated from `docs/design/carnyx-icon.svg` by
# `tools/gen-launcher-icons.py` and named by the manifest. Six files across two
# resource types, all of them referenced, is still nothing for either setting to
# earn: shrinking removes unreferenced resources and there are none.
#
# THE THEME IS STILL A FRAMEWORK THEME
# (@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen), so no styles,
# colours or drawables come with it.
#
# THE cargo-apk BUILD STILL HAS NO RESOURCES AT ALL, and the divergence is wider
# than it was: that packager ships none, so the layout is genuinely absent there
# and `CarnyxAlert` looks it up by name at run time rather than through `R` — an
# absent layout is a supported state, not a broken build. AN ABSENT ICON IS TOO,
# and it looks like one: a cargo-apk build installs with the system's default
# grey Android robot on the launcher. Only the Gradle build wears the icon.
