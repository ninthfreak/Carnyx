android.useAndroidX=true
# Nothing in this project is a Kotlin module, and no AndroidX artifact is pulled
# in yet — the flag is here because AGP warns without it the moment the first
# androidx dependency arrives, which the foreground service's
# `ServiceCompat.startForeground` will need.

org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true

# NO NON-TRANSITIVE R CLASS SETTING, and no resource shrinking: this app has no
# resources of its own. The theme is a framework theme
# (@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen) and no icon is
# declared, so there is no res/ tree to configure. That is parity with the
# cargo-apk build, not an omission.
